<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>网球名片 TennisCard</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎾</text></svg>">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">🎾 网球名片 <span class="en">TennisCard</span></div>
  <div class="subtitle">上传照片 · 自动抠图 · 一键导出 PNG</div>
</header>

<main class="layout">
  <aside class="panel" id="panel">
    <div class="actions">
      <button id="btnDownload" class="btn primary">⬇ 下载 PNG</button>
      <select id="exportScale" title="导出倍率">
        <option value="1">1x</option>
        <option value="2" selected>2x</option>
        <option value="3">3x</option>
      </select>
      <button id="btnReset" class="btn ghost">重置</button>
    </div>

    <div class="sec">
      <div class="sec-head"><h3>模板</h3></div>
      <div class="ctrl"><span class="lbl">风格</span><select id="templateSelect"></select></div>
    </div>

    <div class="sec">
      <div class="sec-head"><h3>基本信息</h3></div>
      <div class="ctrl"><span class="lbl">中文姓名</span><input id="inName" type="text" maxlength="20" placeholder="姓名"></div>
      <div class="ctrl"><span class="lbl">英文姓名</span><input id="inNameEn" type="text" maxlength="40" placeholder="English Name"></div>
      <div class="ctrl"><span class="lbl">惯用手</span>
        <select id="inHand">
          <option>右手</option>
          <option>左手</option>
        </select>
      </div>
      <div class="ctrl"><span class="lbl">NTRP</span><input id="inNtrp" type="number" min="1" max="7" step="0.1" inputmode="decimal" placeholder="1.0 - 7.0"></div>
    </div>

    <div class="sec">
      <div class="sec-head"><h3>身体数据</h3></div>
      <div id="statsGrid"></div>
    </div>

    <div id="imageSections"></div>
  </aside>

  <section class="stage">
    <div class="stage-inner">
      <canvas id="card"></canvas>
    </div>
  </section>
</main>

<div id="toast" class="toast"></div>

<script src="js/templates/registry.js"></script>
<script src="js/matting.js"></script>
<script src="js/templates/shared.js"></script>
<script src="js/templates/classic.js"></script>
<script src="js/templates/dark.js"></script>
<script src="js/app.js"></script>
</body>
</html>
